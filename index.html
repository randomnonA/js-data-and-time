<script>

function onKawara () {
  //Changed color to teal
  document.body.style.background = 'teal'
  document.body.style.height = '100vh'
  document.body.style.display = 'grid'
  document.body.style.justifyContent = 'center'
  document.body.style.alignItems = 'center'

  const d = new Date()
  const day = d.getDate()
  const months = [
    'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
    'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
  ]
  const m = d.getMonth()
  const month = months[m]
  const year = d.getFullYear()
  //Changed the order from big to small
  const dateString = `${year}. ${month}, ${day}`
  
  //Where I got my list of NEW fonts from: https://www.w3.org/Style/Examples/007/fonts.en.html
  const span = document.createElement('span')
  span.textContent = dateString
  //Changed the text color to salmon and size to 23vw
  span.style.color = 'salmon'
  span.style.fontSize = '23vw'
  span.style.fontFamily = 'Times New Roman, Impact, cursive, Bookman'
  document.body.appendChild(span)
}

window.addEventListener('load', onKawara)

</script>
